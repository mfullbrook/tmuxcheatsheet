# SYNTHETIC FIXTURE: legacy pre-tmux-2.4 configuration.
# Hand-assembled from documented historical examples (tmux <= 2.3 man pages,
# widely circulated pre-2015 dotfiles snippets). Not fetched from a single
# real repository. Exercises syntax removed in tmux 2.4 (`bind -t vi-copy`)
# and options removed in tmux 2.1 (mode-mouse, mouse-select-*, status-utf8).

# Clear all default key bindings and start fresh
unbind -a

set -g prefix C-a
bind C-a send-prefix

# UTF-8 options (removed in tmux 2.2)
set -g utf8 on
set -g status-utf8 on

# Pre-2.1 mouse options (replaced by the single `mouse` option)
set -g mode-mouse on
set -g mouse-select-pane on
set -g mouse-resize-pane on
set -g mouse-select-window on

# vi keys in copy mode
set-window-option -g mode-keys vi
setw -g monitor-activity on

# Pre-2.4 copy-mode key table syntax (`bind -t vi-copy`), replaced by
# `bind -T copy-mode-vi ... send -X ...` in tmux 2.4
bind -t vi-copy 'v' begin-selection
bind -t vi-copy 'y' copy-selection
bind -t vi-copy 'V' rectangle-toggle
bind -t vi-copy Escape cancel
bind -t vi-copy WheelUpPane halfpage-up
bind -t vi-copy WheelDownPane halfpage-down

# Emacs copy-mode table variant
bind -t emacs-copy 'C-w' copy-selection

# Environment
setenv -g EDITOR vim
set-environment -g TMUX_LEGACY_FIXTURE 1

# Splits with sensible defaults, chained commands
bind | split-window -h \; select-layout even-horizontal
bind - split-window -v

# Line continuations were common in older configs
set -g status-left "#[fg=green]#S #[fg=yellow]#I \
#[fg=cyan]#P"
set -g status-right "#[fg=cyan]%d %b %R \
#[fg=green]#H"

# Reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
